[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "axon-myelin-seg"
version = "0.0.1"
description = "Paired axon/myelin instance segmentation and g-ratio morphometry in TEM"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "numpy",
  "scipy",
  "scikit-image",
  "scikit-learn",
  "tifffile",
  "imageio",
  "pandas",
  "pyyaml",
  "tqdm",
  "torch",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "matplotlib", "jupyter"]
analysis = ["opencv-python-headless", "PyWavelets"]   # scripts/run (registration, galleries), scripts/eda
nnunet = ["nnunetv2"]
cellpose = ["cellpose"]
cloud = ["modal"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
