data:
  root: data/raw/challenge
  pixel_size_nm: 2.152
  image_size: [3008, 4096]   # H, W
  ignore_label: 1
split:
  file: configs/splits/image_level_5fold_seed0.json   # frozen once created; committed
  group_by: image          # switch to animal once metadata is known
evaluation:
  dice_aggregation: per_image      # per_image | pooled
  hd95_mode: global_per_image      # global_per_image | per_instance
  match_iou_threshold: 0.0         # official rule: max IoU, threshold unstated
  empty_hd95_policy: image_diagonal
  exclude_border_fibers: false
